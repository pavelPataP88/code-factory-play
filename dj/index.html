<style>

b33;border-radius:10px;touch-action:none}.surface-body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:11px;margin-top:9px}.jogcol{display:flex;flex-direction:column;align-items:center;gap:7px}.jog{width:170px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#1d2229 0 38%,#101318 39% 48%,#363f49 49% 51%,#171b20 52% 64%,#3a444e 65% 67%,#0c0f13 68%);box-shadow:inset 0 0 25px #000,0 8px 18px #0009;position:relative;touch-action:none;cursor:grab}.jog:active{cursor:grabbing}.jog-ring{position:absolute;inset:7%;border:1px dashed #929da955;border-radius:50%}.jog-core{position:absolute;inset:35%;border-radius:50%;display:grid;place-items:center;background:#050608;border:2px solid #323a44;box-shadow:0 0 0 7px #0b0d10}.jog-core span{font-size:29px;font-weight:950;color:var(--accent)}.transport{display:grid;grid-template-columns:1fr 1.3fr;gap:6px;width:100%}.cue{background:#483315;border-color:#856127}.play{background:#153a25;border-color:#2b744b}.performance,.hots,.advanced{display:grid;width:100%;gap:5px}.performance{grid-template-columns:repeat(4,1fr)}.hots{grid-template-columns:repeat(3,1fr)}.advanced{grid-template-columns:repeat(4,1fr)}.performance button,.hots button,.advanced button{min-height:31px;font-size:8px}.quant-on{background:#17374d!important;border-color:#3b86b4!important;color:#bce6ff!important}.reverse-on{background:#4c2031!important;border-color:#9b4566!important;color:#ffd4e2!important}.slip-on{background:#3b2950!important;border-color:#7952a2!important;color:#eadcff!important}.hot.active{background:#3b2950;border-color:#7952a2;color:#eadcff}.loop-on{background:#4b3111!important;border-color:#98661e!important;color:#ffdda4!important}.controlcol{display:flex;flex-direction:column;gap:9px}.loadrow{display:grid;grid-template-columns:1fr .7fr;gap:6px}.file{position:relative;overflow:hidden;font-size:10px}.file input{position:absolute;inset:0;opacity:0}.controlcol>label{font-size:10px;font-weight:850;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:3px}.controlcol>label span{justify-self:end;color:#e8edf2}.controlcol>label input{grid-column:1/-1;width:100%}.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.eq label{font-size:9px;color:var(--muted);font-weight:850;text-align:center;display:flex;flex-direction:column;gap:3px}.eq input{width:100%}.mixer{padding:10px 8px;display:flex;flex-direction:column;gap:9px}.mixer-title{text-align:center;color:var(--accent);font-size:10px;font-weight:950;letter-spacing:.16em}.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.channel{background:#0b0e12;border:1px solid #272e36;border-radius:9px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:5px}.channel.active-layer{border-color:#4d8daf;box-shadow:inset 0 0 0 1px #4d8daf55}.chname{font-size:9px;font-weight:950;color:var(--muted)}.chname strong{color:#f1f5f8}.meter{width:8px;height:92px;background:#05070a;border-radius:3px;overflow:hidden;position:relative}.meter i{position:absolute;left:0;right:0;bottom:0;height:2%;background:linear-gradient(to top,#64d682 0 70%,#e9d25a 70% 88%,#ef6f7b 88%);transition:height .05s linear}.vfader{height:93px;width:20px;writing-mode:vertical-lr;direction:rtl}.chbuttons{display:flex;gap:2px}.chbuttons button{min-width:24px;min-height:26px;font-size:7px;padding:0}.xf-a{background:#17374d!important;border-color:#3b86b4!important}.xf-b{background:#4b3111!important;border-color:#98661e!important}.xf-thru{background:#26302a!important;border-color:#4d6656!important}.chbuttons .cue-on{background:#4a3516;border-color:#936b28}.xfader{margin-top:2px}.xfader .labels{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);font-weight:850}.xfader input{width:100%}.rec{background:#4b1720;border-color:#8e2d3d;min-height:34px}.micbox{display:grid;grid-template-columns:1fr 1fr;gap:5px}.micbox label{grid-column:1/-1;font-size:8px;color:var(--muted);font-weight:850;display:grid;grid-template-columns:auto 1fr;gap:5px;align-items:center}.micbox input{width:100%}.mic-on{background:#163a28!important;border-color:#2c7950!important}.talk-on{background:#4b3111!important;border-color:#98661e!important}.karaoke-on{background:#3b2950!important;border-color:#7952a2!important;color:#eadcff!important}.rec.active{background:#7c1425}.status{font-size:9px;line-height:1.3;color:var(--muted);background:#080b0e;border:1px solid #232a32;border-radius:7px;padding:6px;min-height:38px}.download{font-size:9px;color:var(--accent);text-decoration:none;text-align:center;border:1px solid #2f719b;border-radius:7px;padding:6px}footer{text-align:center;color:#77828e;font-size:9px;padding-top:7px}input[type=range]{accent-color:#7dcfff}

@media(max-width:820px){.app{padding:5px}.console{grid-template-columns:1fr 205px 1fr;gap:4px;min-width:760px}.surface{padding:6px}.surface-body{grid-template-columns:122px 1fr;gap:5px}.jog{width:112px}.wave{height:67px}.controlcol{gap:6px}.surface-head{gap:4px}.layer-btn{min-width:30px;padding:0 5px}.track{font-size:10px}.mixer{padding:6px 3px}.vfader,.meter{height:66px}.status{display:none}.master label{display:none}.top{padding-bottom:5px}}

<body>
<main class="app">
<header class="top">
  <div class="brand"><small>FOUR-DECK WEB RELEASE CANDIDATE</small><h1>TABLET DJ v0.6.1</h1></div>
  <div class="master"><label>MASTER <input id="masterGain" type="range" min="0" max="1.2" value="0.82" step="0.01"></label><button id="audioBtn" class="primary">ENABLE AUDIO</button></div>
</header>
<section class="console">
  <section class="surface" id="leftSurface" data-side="left">
    <div class="surface-head">
      <div class="layer-switch"><button class="layer-btn active" data-layer="0">DECK 1</button><button class="layer-btn" data-layer="2">DECK 3</button></div>
      <div class="track" data-role="title">No track loaded</div>
      <div class="deck-meta"><span class="bpm" data-role="bpm">BPM --</span><span data-role="time">00:00 / 00:00</span></div>
    </div>
    <canvas class="wave" data-role="wave" width="900" height="180"></canvas>
    <div class="surface-body">
      <div class="jogcol">
        <div class="jog" data-role="jog"><div class="jog-ring"></div><div class="jog-core"><span data-role="jogLabel">1</span></div></div>
        <div class="transport"><button class="cue" data-action="cue">CUE</button><button class="play" data-action="play">PLAY</button></div>
        <div class="performance"><button data-action="jumpBack">-8</button><button data-action="sync">SYNC</button><button data-action="loop">LOOP 4</button><button data-action="jumpFwd">+8</button></div>
        <div class="advanced"><button data-action="quant">QUANT</button><button data-action="reverse">REV</button><button data-action="slipReverse">SLIP REV</button><button data-action="karaoke">CENTER CUT</button></div>
        <div class="hots"><button class="hot" data-hot="0">HOT 1</button><button class="hot" data-hot="1">HOT 2</button><button class="hot" data-hot="2">HOT 3</button></div>
      </div>
      <div class="controlcol">
        <div class="loadrow"><label class="file">LOAD TRACK<input data-action="file" type="file" accept="audio/*"></label><button data-action="demo">DEMO</button></div>
        <label>TEMPO <span data-role="tempoVal">0.0%</span><input data-control="tempo" type="range" min="-16" max="16" value="0" step="0.1"></label>
        <label>FILTER <span data-role="filterVal">OPEN</span><input data-control="filter" type="range" min="0" max="1" value="1" step="0.001"></label>
        <div class="eq"><label>HI<input data-control="hi" type="range" min="-18" max="6" value="0" step="0.5"></label><label>MID<input data-control="mid" type="range" min="-18" max="6" value="0" step="0.5"></label><label>LOW<input data-control="low" type="range" min="-18" max="6" value="0" step="0.5"></label></div>
      </div>
    </div>
  </section>

  <section class="mixer">
    <div class="mixer-title">4 CHANNEL MIXER</div>
    <div class="channels" id="channels"></div>
    <div class="xfader"><div class="labels"><span>A ← 1/3</span><span>CROSSFADER</span><span>2/4 → B</span></div><input id="crossfader" type="range" min="-1" max="1" value="0" step="0.001"></div>
    <div class="micbox"><button id="micBtn">MIC OFF</button><button id="talkBtn">TALKOVER OFF</button><label>MIC GAIN <input id="micGain" type="range" min="0" max="2" value="1" step="0.01"></label></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px"><button id="cueOutBtn">CUE OUT OFF</button><button class="rec" id="recordBtn">REC MASTER</button></div><audio id="cueMonitor"></audio>
    <div class="status" id="status">Audio engine idle</div>
  </section>

  <section class="surface" id="rightSurface" data-side="right">
    <div class="surface-head">
      <div class="layer-switch"><button class="layer-btn active" data-layer="1">DECK 2</button><button class="layer-btn" data-layer="3">DECK 4</button></div>
      <div class="track" data-role="title">No track loaded</div>
      <div class="deck-meta"><span class="bpm" data-role="bpm">BPM --</span><span data-role="time">00:00 / 00:00</span></div>
    </div>
    <canvas class="wave" data-role="wave" width="900" height="180"></canvas>
    <div class="surface-body">
      <div class="jogcol">
        <div class="jog" data-role="jog"><div class="jog-ring"></div><div class="jog-core"><span data-role="jogLabel">2</span></div></div>
        <div class="transport"><button class="cue" data-action="cue">CUE</button><button class="play" data-action="play">PLAY</button></div>
        <div class="performance"><button data-action="jumpBack">-8</button><button data-action="sync">SYNC</button><button data-action="loop">LOOP 4</button><button data-action="jumpFwd">+8</button></div>
        <div class="advanced"><button data-action="quant">QUANT</button><button data-action="reverse">REV</button><button data-action="slipReverse">SLIP REV</button><button data-action="karaoke">CENTER CUT</button></div>
        <div class="hots"><button class="hot" data-hot="0">HOT 1</button><button class="hot" data-hot="1">HOT 2</button><button class="hot" data-hot="2">HOT 3</button></div>
      </div>
      <div class="controlcol">
        <div class="loadrow"><label class="file">LOAD TRACK<input data-action="file" type="file" accept="audio/*"></label><button data-action="demo">DEMO</button></div>
        <label>TEMPO <span data-role="tempoVal">0.0%</span><input data-control="tempo" type="range" min="-16" max="16" value="0" step="0.1"></label>
        <label>FILTER <span data-role="filterVal">OPEN</span><input data-control="filter" type="range" min="0" max="1" value="1" step="0.001"></label>
        <div class="eq"><label>HI<input data-control="hi" type="range" min="-18" max="6" value="0" step="0.5"></label><label>MID<input data-control="mid" type="range" min="-18" max="6" value="0" step="0.5"></label><label>LOW<input data-control="low" type="range" min="-18" max="6" value="0" step="0.5"></label></div>
      </div>
    </div>
  </section>
</section>
<footer>Decks 1/3 share the left surface; decks 2/4 share the right. Inactive layers keep playing.</footer>
<pre id="autotest" hidden></pre>
</main>
<script>
'use strict';

const DEMO_BPMS=[120,124,128,132];
const DEMO_FREQ=[110,130.81,146.83,174.61];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=s=>{s=Math.max(0,s||0);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`};
const STORE='tablet-dj-v06';const memoryStore=new Map();let storageMode='localStorage';
function loadJSON(k,fallback){const key=`${STORE}.${k}`;try{const v=localStorage.getItem(key);storageMode='localStorage';return v?JSON.parse(v):fallback}catch{storageMode='memory';const v=memoryStore.get(key);return v?JSON.parse(v):fallback}}
function saveJSON(k,v){const key=`${STORE}.${k}`,json=JSON.stringify(v);try{localStorage.setItem(key,json);storageMode='localStorage'}catch{storageMode='memory';memoryStore.set(key,json)}}
function loadGlobal(){return loadJSON('global',{master:.82,cross:0,channels:[{fader:1,xf:'A'},{fader:1,xf:'B'},{fader:1,xf:'A'},{fader:1,xf:'B'}]})}
function saveGlobal(){if(!decks.length)return;saveJSON('global',{master:+$('#masterGain').value,cross:+$('#crossfader').value,channels:decks.map(d=>({fader:d.channelFader,xf:d.xfAssign}))})}

let audio=null,masterGain=null,musicBus=null,recDest=null,cueDest=null,cueMonitor=null,mediaRecorder=null,recordChunks=[],micStream=null,micSource=null,micHighpass=null,micComp=null,micGainNode=null,micAnalyser=null,talkover=false,micEnabled=false;
let decks=[]; let surfaces=[]; let runtimeErrors=[];
const statusEl=$('#status');
function status(s){statusEl.textContent=s;}

class DeckEngine{
  constructor(index,audio,master,cueBus){
    this.index=index;this.number=index+1;this.audio=audio;this.buffer=null;this.reverseBuffer=null;this.source=null;this.playing=false;this.offset=0;this.startedAt=0;this.playbackRate=1;this.direction=1;this.cuePoint=0;this.bpm=0;this.hot=[null,null,null];this.loop=false;this.loopStart=0;this.loopEnd=0;this.quantize=true;this.slipShadow=null;this.title='No track loaded';this.wavePeaks=null;this.channelFader=1;this.pfl=false;this.xfAssign=(index===0||index===2)?'A':'B';this.karaoke=false;this.waveGray=null;this.waveBlue=null;
    this.input=audio.createGain();this.normalGain=audio.createGain();this.karaokeGain=audio.createGain();this.karaokeGain.gain.value=0;this.splitter=audio.createChannelSplitter(2);this.invertR=audio.createGain();this.invertR.gain.value=-1;this.centerCutSum=audio.createGain();this.low=audio.createBiquadFilter();this.mid=audio.createBiquadFilter();this.high=audio.createBiquadFilter();this.filter=audio.createBiquadFilter();this.fader=audio.createGain();this.cross=audio.createGain();this.cueGain=audio.createGain();this.cueGain.gain.value=0;this.analyser=audio.createAnalyser();
    this.low.type='lowshelf';this.low.frequency.value=200;this.mid.type='peaking';this.mid.frequency.value=1000;this.mid.Q.value=.8;this.high.type='highshelf';this.high.frequency.value=5000;this.filter.type='lowpass';this.filter.frequency.value=22000;this.filter.Q.value=.55;this.analyser.fftSize=256;
    this.input.connect(this.normalGain).connect(this.low);this.input.connect(this.splitter);this.splitter.connect(this.centerCutSum,0);this.splitter.connect(this.invertR,1);this.invertR.connect(this.centerCutSum);this.centerCutSum.connect(this.karaokeGain).connect(this.low);this.low.connect(this.mid).connect(this.high).connect(this.filter);this.filter.connect(this.fader).connect(this.cross).connect(this.analyser).connect(master);this.filter.connect(this.cueGain).connect(cueBus);this.meterData=new Uint8Array(this.analyser.frequencyBinCount);
  }
  setBuffer(b,title,bpm=0){this.stop(true);this.buffer=b;this.reverseBuffer=this.makeReverseBuffer(b);this.title=title;this.bpm=bpm;this.direction=1;this.cuePoint=0;this.hot=[null,null,null];this.loop=false;this.wavePeaks=this.makePeaks(b,720);this.buildWaveCaches();this.restoreTrackState();refreshSurfaces();}
  trackKey(){return encodeURIComponent(`${this.title}|${this.buffer?.duration?.toFixed(3)||0}`)}
  restoreTrackState(){if(!this.buffer)return;const st=loadJSON(`track.${this.trackKey()}`,null);if(!st)return;if(Array.isArray(st.hot))this.hot=st.hot.map(v=>typeof v==='number'?clamp(v,0,this.buffer.duration):null);if(typeof st.cuePoint==='number')this.cuePoint=clamp(st.cuePoint,0,this.buffer.duration);if(typeof st.quantize==='boolean')this.quantize=st.quantize;if(typeof st.karaoke==='boolean'&&st.karaoke!==this.karaoke){this.karaoke=st.karaoke;this.normalGain.gain.value=this.karaoke?0:1;this.karaokeGain.gain.value=this.karaoke?1:0}}
  saveTrackState(){if(!this.buffer)return;saveJSON(`track.${this.trackKey()}`,{hot:this.hot,cuePoint:this.cuePoint,quantize:this.quantize,karaoke:this.karaoke})}
  buildWaveCaches(){if(!this.wavePeaks)return;const mk=color=>{const c=document.createElement('canvas');c.width=900;c.height=180;const x=c.getContext('2d'),mid=90,p=this.wavePeaks,bw=900/p.length;x.fillStyle='#080a0d';x.fillRect(0,0,900,180);x.strokeStyle='#20262e';for(let i=1;i<8;i++){x.beginPath();x.moveTo(i*900/8,0);x.lineTo(i*900/8,180);x.stroke()}x.fillStyle=color;for(let i=0;i<p.length;i++){const a=Math.max(1,p[i]*180*.45);x.fillRect(i*bw,mid-a,bw*.72,a*2)}return c};this.waveGray=mk('#65717e');this.waveBlue=mk('#7dcfff')}
  makeReverseBuffer(b){const out=this.audio.createBuffer(b.numberOfChannels,b.length,b.sampleRate);for(let ch=0;ch<b.numberOfChannels;ch++){const src=b.getChannelData(ch),dst=out.getChannelData(ch);for(let i=0,j=src.length-1;i<src.length;i++,j--)dst[i]=src[j]}return out}
  loadDemo(){const sr=this.audio.sampleRate,seconds=28,b=this.audio.createBuffer(2,sr*seconds,sr),base=DEMO_FREQ[this.index],bpm=DEMO_BPMS[this.index],beat=60/bpm;for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<d.length;i++){const t=i/sr,k=t%beat,h=t%(beat/2);const kick=k<.065?Math.sin(2*Math.PI*(78-42*k/.065)*t)*Math.exp(-k*44):0;const hat=h<.015?(Math.random()*2-1)*Math.exp(-h*190)*.08:0;const tone=.105*Math.sin(2*Math.PI*base*t)+.045*Math.sin(2*Math.PI*base*2*t);d[i]=clamp(kick*.52+hat+tone,-1,1)}}this.setBuffer(b,`Demo Deck ${this.number} — ${bpm} BPM`,bpm);status(`Deck ${this.number}: demo loaded`)}
  async loadFile(file){if(!file)return;status(`Deck ${this.number}: decoding ${file.name}…`);const data=await file.arrayBuffer();const b=await this.audio.decodeAudioData(data.slice(0));const bpm=this.estimateBpm(b);this.setBuffer(b,file.name,bpm);status(`Deck ${this.number}: loaded${bpm?` • ~${bpm.toFixed(1)} BPM`:''}`)}
  makePeaks(b,count){const data=b.getChannelData(0),step=Math.max(1,Math.floor(data.length/count)),out=new Float32Array(count);for(let i=0;i<count;i++){let p=0,st=i*step,jump=Math.max(1,Math.floor(step/22));for(let j=st;j<Math.min(st+step,data.length);j+=jump)p=Math.max(p,Math.abs(data[j]));out[i]=p}return out}
  start(at=this.offset){if(!this.buffer)return;this.stopSource();const s=this.audio.createBufferSource();s.buffer=this.direction===1?this.buffer:this.reverseBuffer;s.playbackRate.value=this.playbackRate;if(this.loop&&this.direction===1){s.loop=true;s.loopStart=this.loopStart;s.loopEnd=this.loopEnd}s.connect(this.input);const safe=clamp(at,0,Math.max(0,this.buffer.duration-.001));const sourceOffset=this.direction===1?safe:Math.max(0,this.buffer.duration-safe);s.start(0,sourceOffset);this.source=s;this.offset=safe;this.startedAt=this.audio.currentTime;this.playing=true;s.onended=()=>{if(this.source===s){const t=this.currentTime();if((this.direction===1&&t>=this.buffer.duration-.05)||(this.direction===-1&&t<=.05)){this.playing=false;this.offset=this.direction===1?0:0;this.source=null;refreshSurfaces()}}};refreshSurfaces()}

>setTimeout(r,220));decks[3].slipReverseUp();result.slipDirection=decks[3].direction;result.slipShadow=decks[3].slipShadow;if(result.slipDirection!==1||result.slipShadow!==null)throw new Error('slip reverse recovery failed');setTalkover(true);result.talkover=talkover;setTalkover(false);if(!result.talkover)throw new Error('talkover state failed');decks[2].hotCue(1);const savedHot=loadJSON(`track.${decks[2].trackKey()}`,{}).hot?.[1];result.persistence=typeof savedHot==='number';result.storageMode=storageMode;if(!result.persistence)throw new Error('hot cue persistence failed');const soakStart=decks.map(d=>d.currentTime());await new Promise(r=>setTimeout(r,2200));const soakEnd=decks.map(d=>d.currentTime());result.soakAdvance=soakEnd.map((v,i)=>+(v-soakStart[i]).toFixed(3));if(result.soakAdvance.some(v=>Math.abs(v)<.4))throw new Error('4-deck soak stalled');result.uiFrames=uiFrames;applyCrossfader(-1);await new Promise(r=>setTimeout(r,60));result.crossGains=decks.map(d=>+d.cross.gain.value.toFixed(3));if(result.crossGains[1]>.08||result.crossGains[3]>.08)throw new Error('crossfader right group not muted');result.runtimeErrors=[...runtimeErrors];if(runtimeErrors.length)throw new Error('runtime errors detected');result.pass=true}catch(e){result.errors.push(String(e?.message||e))}$('#autotest').hidden=false;$('#autotest').textContent=JSON.stringify(result,null,2);document.title=`AUTOTEST:${result.pass?'PASS':'FAIL'}`;window.__autotest=result}
if(new URLSearchParams(location.search).has('autotest'))setTimeout(selfTest,100);
