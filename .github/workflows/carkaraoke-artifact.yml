name: Car Karaoke APK transport

on:
  workflow_dispatch:

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK
        run: |
          curl -fL -o CarKaraokeMixer-v1.0.0.apk https://github.com/pavelPataP88/code-factory-play/releases/download/car-karaoke-v1.0.0/CarKaraokeMixer.apk
          echo "449ca42dff4b7a56610f974b46a7b1278c2a6874809f6c15f81a685bfb09776d  CarKaraokeMixer-v1.0.0.apk" | sha256sum -c -
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarKaraokeMixer-v1.0.0
          path: CarKaraokeMixer-v1.0.0.apk
          if-no-files-found: error
          compression-level: 0
